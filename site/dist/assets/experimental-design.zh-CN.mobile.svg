<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">实验设计：模型停止规则与可见性参照</title><desc id="desc">RGB与目标短语输入模型，回答分别驱动TRACE和delay-only。可见性真值单独驱动Oracle，距离真值用于评分。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#637a8a"/></marker><marker id="truth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aa641f"/></marker></defs><g font-family="Arial"><rect x="80" y="24" width="440" height="100" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="300.0" y="69.3" text-anchor="middle" font-size="28" fill="#1f2328" font-weight="600">固定脚本路线</text><text x="300.0" y="98.3" text-anchor="middle" font-size="22" fill="#59636e" font-weight="400">当前 RGB + 目标短语</text><path d="M300 124 V170" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="300,170 295.5,159 304.5,159" fill="#637a8a"/><rect x="80" y="170" width="440" height="100" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="300.0" y="215.3" text-anchor="middle" font-size="28" fill="#1f2328" font-weight="600">视觉 Judger</text><text x="300.0" y="244.3" text-anchor="middle" font-size="22" fill="#59636e" font-weight="400">保存 Yes / No 回答</text><path d="M300 270 V300 H156 V334" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="156,334 151.5,323 160.5,323" fill="#637a8a"/><path d="M300 300 H444 V334" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="444,334 439.5,323 448.5,323" fill="#637a8a"/><rect x="24" y="334" width="264" height="100" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="156.0" y="380.45" text-anchor="middle" font-size="27" fill="#1f2328" font-weight="600