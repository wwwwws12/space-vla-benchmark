<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc" lang="en"><title id="title">Experimental design: model stop rules and visibility reference</title><desc id="desc">RGB and the target phrase go to the Judger. Saved answers feed TRACE and delay-only. Visibility truth independently feeds the Oracle; distance truth scores the resulting route prefixes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#637a8a"/></marker><marker id="truth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aa641f"/></marker></defs><g font-family="Arial"><rect x="80" y="24" width="440" height="100" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="300.0" y="69.3" text-anchor="middle" font-size="28" fill="#1f2328" font-weight="600">Fixed scripted route</text><text x="300.0" y="98.3" text-anchor="middle" font-size="22" fill="#59636e" font-weight="400">Current RGB + target phrase</text><path d="M300 124 V170" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="300,170 295.5,159 304.5,159" fill="#637a8a"/><rect x="80" y="170" width="440" height="100" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="300.0" y="215.3" text-anchor="middle" font-size="28" fill="#1f2328" font-weight="600">Visual Judger</text><text x="300.0" y="244.3" text-anchor="middle" font-size="22" fill="#59636e" font-weight="400">Saved Yes / No answers</text><path d="M300 270 V300 H156 V334" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="156,334 151.5,323 160.5,323" fill="#637a8a"/><path d="M300 300 H444 V334" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="444,334 439.5,323 448.5,323" fill="#637a8a"/><rect x="24" y="334" width="264" height="100" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="156.0" y="380.45" text-anchor="middle" font-size="27" fill="#1f2328" font-weight="600">TRACE</text><text x="156.0" y="406.45" text-anchor="middle" font-size="19" fill="#59636e" font-weight="400">K consecutive Yes</text><rect x="312" y="334" width="264" height="100" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="444.0" y="380.95" text-anchor="middle" font-size="27" fill="#1f2328" font-weight="600">delay-only</text><text x="444.0" y="405.95" text-anchor="middle" font-size="18" fill="#59636e" font-weight="400">Fixed wait after first Yes</text><path d="M156 434 V474 H300 V512" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="300,512 295.5,501 304.5,501" fill="#637a8a"/><path d="M444 434 V474 H300" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="300,474 311,469.5 311,478.5" fill="#637a8a"/><rect x="80" y="512" width="440" height="126" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="300.0" y="570.15" text-anchor="middle" font-size="29" fill="#1f2328" font-weight="600">Stop outcomes</text><text x="300.0" y="600.15" text-anchor="middle" font-size="23" fill="#59636e" font-weight="400">SR · SPL · OSR · NE · PL</text><text x="24" y="732" text-anchor="start" font-size="20" fill="#aa641f" font-weight="600">TRUTH REFERENCE AND SCORING</text><rect x="24" y="770" width="252" height="108" rx="10" fill="#fff9ee" stroke="#aa641f" stroke-width="1.5"/><text x="150.0" y="819.75" text-anchor="middle" font-size="25" fill="#1f2328" font-weight="600">Visibility truth</text><text x="150.0" y="845.75" text-anchor="middle" font-size="19" fill="#59636e" font-weight="400">Pixels; Moon luminance</text><rect x="324" y="770" width="252" height="108" rx="10" fill="#fff9ee" stroke="#aa641f" stroke-width="1.5"/><text x="450.0" y="819.9" text-anchor="middle" font-size="24" fill="#1f2328" font-weight="600">Visibility Oracle</text><text x="450.0" y="844.9" text-anchor="middle" font-size="18" fill="#59636e" font-weight="400">TRACE with truth labels</text><path d="M276 824 H324" fill="none" stroke="#aa641f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><polygon points="324,824 313,828.5 313,819.5" fill="#aa641f"/><path d="M450 770 V684 H300 V638" fill="none" stroke="#aa641f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><polygon points="300,638 304.5,649 295.5,649" fill="#aa641f"/><rect x="80" y="970" width="440" height="96" rx="10" fill="#fff9ee" stroke="#aa641f" stroke-width="1.5"/><text x="300.0" y="1013.45" text-anchor="middle" font-size="27" fill="#1f2328" font-weight="600">Distance truth</text><text x="300.0" y="1041.45" text-anchor="middle" font-size="21" fill="#59636e" font-weight="400">Evaluation only</text><path d="M520 1018 H590 V574 H520" fill="none" stroke="#aa641f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><polygon points="520,574 531,569.5 531,578.5" fill="#aa641f"/></g></svg>
