<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1010" viewBox="0 0 400 1010"><rect width="400" height="1010" fill="#ffffff" />
<text x="16" y="28" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#48515a">01  固定输入</text>
<rect x="16" y="46" width="368" height="128" rx="3" fill="#f3f4f3" stroke="#bbc3ca" />
<text x="36" y="78" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="600" fill="#20272e">固定脚本轨迹</text>
<text x="36" y="106" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#353d45">相同路线 · 两种光照</text>
<text x="36" y="140" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" fill="#29475c">当前 RGB 图像 + 目标短语</text>
<path d="M200 174V218" fill="none" stroke="#29475c" stroke-width="1.5" /><path d="m196 211 4 7 4-7" fill="none" stroke="#29475c" stroke-width="1.5" />
<text x="16" y="201" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#48515a">02  视觉判断</text>
<rect x="16" y="225" width="368" height="150" rx="3" fill="#ffffff" stroke="#bbc3ca" />
<text x="36" y="257" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#20272e">每次评测使用一个 Judger</text>
<text x="36" y="287" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#353d45">Qwen2.5-VL-3B · Lance_3B</text>
<text x="36" y="312" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#353d45">Nova Lite 1.0</text>
<text x="36" y="348" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" fill="#29475c">保存 Yes / No 回答</text>
<path d="M200 375V414" fill="none" stroke="#29475c" stroke-width="1.5" /><path d="m196 407 4 7 4-7" fill="none" stroke="#29475c" stroke-width="1.5" />
<text x="16" y="406" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#48515a">03  停止控制</text>
<path d="M104 428v-10h192v10" fill="none" stroke="#29475c" stroke-width="1.5" />
<rect x="16" y="428" width="176" height="96" rx="3" fill="#e7ecef" stroke="#91a3b1" />
<rect x="208" y="428" width="176" height="96" rx="3" fill="#ffffff" stroke="#bbc3ca" />
<text x="32" y="457" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#20272e">TRACE</text>
<text x="32" y="483" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#353d45">连续 K 次 Yes</text>
<text x="32" y="507" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#353d45">每 q 步查询</text>
<text x="224" y="457" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#20272e">delay-only</text>
<text x="224" y="483" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#353d45">首次 Yes 后等待</text>
<text x="224" y="507" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#353d45">(K−1)q 个动作步</text>
<text x="16" y="548" font-family="Arial,Microsoft YaHei,sans-serif" font-size="11" font-weight="600" fill="#345d49">独立参照</text>
<rect x="16" y="564" width="176" height="100" rx="3" fill="#f0f3ef" stroke="#9eafa2" />
<rect x="208" y="564" width="176" height="100" rx="3" fill="#f3f4f3" stroke="#bbc3ca" />
<text x="32" y="594" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" fill="#20272e">可见性 Oracle</text>
<text x="32" y="620" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#345d49">使用可见性真值</text>
<text x="32" y="644" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#353d45">→ TRACE 回放</text>
<text x="224" y="594" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" fill="#20272e">脚本终点</text>
<text x="224" y="620" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#353d45">沿固定路线</text>
<text x="224" y="644" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#353d45">→ native STOP</text>
<path d="M384 476h8v216H200v29M384 612h8" fill="none" stroke="#58636c" stroke-width="1.5" /><path d="M192 524v9H8v146h384M192 664v15" fill="none" stroke="#58636c" stroke-width="1.5" /><path d="m196 715 4 7 4-7" fill="none" stroke="#58636c" stroke-width="1.5" />
<text x="16" y="714" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#48515a">04  结果评测</text>
<rect x="16" y="734" width="368" height="210" rx="3" fill="#e7ecef" stroke="#e7ecef" />
<text x="36" y="766" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="600" fill="#20272e">停止结果指标</text>
<text x="36" y="800" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" fill="#20272e">SR · SPL · OSR · NE · PL</text>
<text x="36" y="832" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#43515d">使用距离真值评分</text>
<text x="36" y="858" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#43515d">火星 / 月球：&lt;20 m · 太空舱：&lt;2 m</text>
<text x="36" y="888" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#43515d">240 条 test / 模型 / 世界</text>
<text x="36" y="920" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#43515d">可见性 ≠ 距离判定成功</text>
<text x="16" y="974" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#353d45">真值不进入 Judger 输入。</text>
<text x="16" y="996" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#353d45">原生 STOP 始终优先。</text>
</svg>