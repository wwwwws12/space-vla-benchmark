<text x="52" y="402" class="body" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#353d45">Target pixels · Moon luminance</text>
<text x="52" y="422" class="s" font-family="Arial,Microsoft YaHei,sans-serif" font-size="11" fill="#48515a">Evaluation only</text>
