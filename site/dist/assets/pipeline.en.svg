<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
<title id="title">Space VLA evaluation architecture</title>
<desc id="desc">Image and target phrase feed the Judger. Recorded model answers drive TRACE and delay-only. Visibility truth independently drives the Oracle. Script-endpoint and distance scoring are separate references.</desc>
<rect width="1280" height="600" fill="#ffffff" />
