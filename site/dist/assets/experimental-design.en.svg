<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc" lang="en"><title id="title">Experimental design: model stop rules and visibility reference</title><desc id="desc">RGB and the target phrase go to the Judger. Saved answers feed TRACE and delay-only. Visibility truth independently feeds the Oracle; distance truth scores the resulting route prefixes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#637a8a"/></marker><marker id="truth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aa641f"/></marker></defs><g font-family="Arial"><text x="24" y="27" text-anchor="start" font-size="15" fill="#59636e" font-weight="600">MODEL-BASED STOP RULES</text><rect x="24" y="96" width="218" height="90" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="133.0" y="137.35" text-anchor="middle" font-size="21" fill="#1f2328" font-weight="600">Fixed scripted route</text><text x="133.0" y="159.35" text-anchor="middle" font-size="15" fill="#59636e" font-weight="400">Current RGB + target phrase</text><rect x="296" y="96" width="216" height="90" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="404.0" y="137.2" text-anchor="middle" font-size="22" fill="#1f2328" font-weight="600">Visual Judger</text><text x="404.0" y="160.2" text-anchor="middle" font-size="16" fill="#59636e" font-weight="400">Saved Yes / No answers</text><rect x="596" y="45" width="216" height="78" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="704.0" y="80.7" text-anchor="middle" font-size="22" fill="#1f2328" font-weight="600">TRACE</text><text x="704.0" y="102.7" text-anchor="middle" font-size="15" fill="#59636e" font-weight="400">K consecutive Yes</text><rect x="596" y="158" width="216" height="78" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="704.0" y="193.7" text-anchor="middle" font-size="22" fill="#1f2328" font-weight="600">delay-only</text><text x="704.0" y="215.7" text-anchor="middle" font-size="15" fill="#59636e" font-weight="400">Fixed wait after first Yes</text><rect x="884" y="148" width="212" height="118" rx="10" fill="#f5f8fb" stroke="#355b73" stroke-width="1.5"/><text x="990.0" y="189.7" text-anchor="middle" font-size="22" fill="#1f2328" font-weight="600">Stop outcomes</text><text x="990.0" y="214.7" text-anchor="middle" font-size="18" fill="#59636e" font-weight="400">SR · SPL · OSR</text><text x="990.0" y="239.7" text-anchor="middle" font-size="18" fill="#59636e" font-weight="400">NE · PL</text><path d="M242 141 H296" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="296,141 285,145.5 285,136.5" fill="#637a8a"/><path d="M512 141 H554 V84 H596" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="596,84 585,88.5 585,79.5" fill="#637a8a"/><path d="M554 141 V197 H596" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="596,197 585,201.5 585,192.5" fill="#637a8a"/><path d="M812 84 H846 V188 H884" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="884,188 873,192.5 873,183.5" fill="#637a8a"/><path d="M812 197 H884" fill="none" stroke="#637a8a" stroke-width="2" stroke-linejoin="round"/><polygon points="884,197 873,201.5 873,192.5" fill="#637a8a"/><text x="296" y="297" text-anchor="start" font-size="15" fill="#aa641f" font-weight="600">TRUTH REFERENCE AND SCORING</text><rect x="296" y="326" width="216" height="86" rx="10" fill="#fff9ee" stroke="#aa641f" stroke-width="1.5"/><text x="404.0" y="365.35" text-anchor="middle" font-size="21" fill="#1f2328" font-weight="600">Visibility truth</text><text x="404.0" y="387.35" text-anchor="middle" font-size="15" fill="#59636e" font-weight="400">Pixels; Moon luminance</text><rect x="596" y="326" width="216" height="86" rx="10" fill="#fff9ee" stroke="#aa641f" stroke-width="1.5"/><text x="704.0" y="365.35" text-anchor="middle" font-size="21" fill="#1f2328" font-weight="600">Visibility Oracle</text><text x="704.0" y="387.35" text-anchor="middle" font-size="15" fill="#59636e" font-weight="400">TRACE with truth labels</text><path d="M512 369 H596" fill="none" stroke="#aa641f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><polygon points="596,369 585,373.5 585,364.5" fill="#aa641f"/><path d="M812 369 H850 V222 H884" fill="none" stroke="#aa641f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><polygon points="884,222 873,226.5 873,217.5" fill="#aa641f"/><rect x="596" y="452" width="216" height="64" rx="10" fill="#fff9ee" stroke="#aa641f" stroke-width="1.5"/><text x="704.0" y="480.5" text-anchor="middle" font-size="20" fill="#1f2328" font-weight="600">Distance truth</text><text x="704.0" y="501.5" text-anchor="middle" font-size="14" fill="#59636e" font-weight="400">Evaluation only</text><path d="M812 484 H990 V266" fill="none" stroke="#aa641f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><polygon points="990,266 994.5,277 985.5,277" fill="#aa641f"/><text x="1007" y="386" text-anchor="start" font-size="15" fill="#aa641f" font-weight="400">Evaluation only</text></g></svg>
