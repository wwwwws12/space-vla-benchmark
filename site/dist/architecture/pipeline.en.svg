<text x="34" y="48" text-anchor="start" font-size="14" font-weight="600" fill="#afbec7">01  OBSERVATIONS</text>
<text x="330" y="48" text-anchor="start" font-size="14" font-weight="600" fill="#afbec7">02  VISUAL JUDGMENT</text>
<text x="660" y="48" text-anchor="start" font-size="14" font-weight="600" fill="#afbec7">03  STOPPING RULES</text>
<text x="1010" y="48" text-anchor="start" font-size="14" font-weight="600" fill="#afbec7">04  SCORING</text>
<text x="99" y="128" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">Observation</text>
<text x="56" y="198" text-anchor="start" font-size="18" font-weight="400" fill="#edf4f6">Current RGB image</text>
<text x="56" y="224" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">1920 × 1080</text>
<text x="56" y="261" text-anchor="start" font-size="18" font-weight="400" fill="#7cdcc8">+ target phrase</text>
<text x="56" y="308" text-anchor="start" font-size="14" font-weight="400" fill="#afbec7">Same route · two lightings</text>
<text x="56" y="334" text-anchor="start" font-size="14" font-weight="400" fill="#afbec7">Isaac Sim renders each view</text>
<text x="395" y="128" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">Visual Judger</text>
<text x="352" y="182" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">One model per evaluation</text>
<text x="352" y="222" text-anchor="start" font-size="18" font-weight="400" fill="#edf4f6">Qwen2.5-VL-3B</text>
<text x="352" y="257" text-anchor="start" font-size="18" font-weight="400" fill="#edf4f6">Lance_3B</text>
<text x="352" y="292" text-anchor="start" font-size="18" font-weight="400" fill="#edf4f6">Nova Lite 1.0</text>
<text x="352" y="332" text-anchor="start" font-size="15" font-weight="400" fill="#7cdcc8">Saved Yes / No answers</text>
<text x="725" y="124" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">TRACE</text>
<text x="682" y="160" text-anchor="start" font-size="17" font-weight="400" fill="#edf4f6">K consecutive Yes answers</text>
<text x="682" y="186" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Query every q action steps</text>
<text x="725" y="272" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">delay-only</text>
<text x="682" y="304" text-anchor="start" font-size="16" font-weight="400" fill="#edf4f6">First Yes → wait (K−1)q steps</text>
<text x="682" y="330" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">No further confirmation</text>
<text x="99" y="464" text-anchor="start" font-size="18" font-weight="600" fill="#edf4f6">Visibility truth</text>
<text x="56" y="503" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Target px · Moon luminance</text>
<text x="56" y="538" text-anchor="start" font-size="16" font-weight="400" fill="#91baee">Evaluation only</text>
<text x="725" y="464" text-anchor="start" font-size="18" font-weight="600" fill="#edf4f6">Visibility Oracle</text>
<text x="682" y="505" text-anchor="start" font-size="17" font-weight="400" fill="#edf4f6">Truth → TRACE replay</text>
<text x="682" y="537" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Same frozen K/q</text>
<text x="725" y="650" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">Script endpoint</text>
<text x="682" y="684" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">Fixed route → native STOP</text>
<text x="1075" y="128" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">Stop metrics</text>
<text x="1032" y="203" text-anchor="start" font-size="23" font-weight="400" fill="#edf4f6">SR</text>
<text x="1032" y="228" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Within the success region</text>
<text x="1032" y="290" text-anchor="start" font-size="23" font-weight="400" fill="#edf4f6">SPL</text>
<text x="1032" y="315" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Success × path efficiency</text>
<text x="1032" y="374" text-anchor="start" font-size="20" font-weight="400" fill="#edf4f6">OSR · NE · PL</text>
<text x="1032" y="404" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Prefix, distance, path length</text>
<text x="1032" y="496" text-anchor="start" font-size="19" font-weight="400" fill="#edf4f6">240 test routes</text>
<text x="1032" y="525" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">per model / world</text>
<text x="1075" y="648" text-anchor="start" font-size="18" font-weight="600" fill="#edf4f6">Distance truth</text>
<text x="1032" y="681" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">Mars / Moon &lt;20 m</text>
<text x="1032" y="706" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">Cabin &lt;2 m</text>
<text x="332" y="476" text-anchor="start" font-size="16" font-weight="600" fill="#91baee">Independent reference</text>
<text x="332" y="523" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Never enters the Judger</text>
<text x="34" y="640" text-anchor="start" font-size="17" font-weight="600" fill="#edf4f6">Held fixed across lighting conditions</text>
<text x="34" y="673" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">Routes · targets · cameras · dev/test splits</text>
<text x="34" y="703" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">K/q selected on baseline dev, then frozen</text>
<text x="34" y="767" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Native STOP takes priority in every rule.</text>
<text x="1246" y="767" text-anchor="end" font-size="15" font-weight="400" fill="#afbec7">Visibility ≠ distance-based success</text>
<text x="56" y="285" text-anchor="start" font-size="14" font-weight="400" fill="#afbec7">Scripted trajectory</text>
</svg>