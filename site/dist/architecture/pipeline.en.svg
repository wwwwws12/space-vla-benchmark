<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" width="1280" height="790" class="architecture-svg architecture-desktop" role="img" aria-labelledby="export-en-title export-en-desc" data-architecture-svg="desktop">
<title id="export-en-title">Evaluation data flow</title><desc id="export-en-desc">Current RGB and target phrase enter one Judger. Saved answers separately drive TRACE and delay-only. Visibility truth independently drives the Oracle. The script endpoint is a reference. Distance truth scores all outcomes. Motion illustrates dependencies, not model outputs or actual timings.</desc>
