<text x="24" y="37" text-anchor="start" font-size="15" font-weight="600" fill="#afbec7">OBSERVATIONS → VISUAL JUDGMENT</text>
<text x="89" y="106" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">Observation</text>
<text x="44" y="152" text-anchor="start" font-size="16" font-weight="400" fill="#7cdcc8">Current RGB (1920 × 1080) + target phrase</text>
<text x="44" y="188" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Scripted route · two lightings · Isaac Sim</text>
<text x="89" y="300" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">Visual Judger</text>
<text x="44" y="346" text-anchor="start" font-size="16" font-weight="400" fill="#edf4f6">Qwen2.5-VL-3B · Lance_3B · Nova Lite 1.0</text>
<text x="44" y="374" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">One model per evaluation</text>
<text x="44" y="404" text-anchor="start" font-size="16" font-weight="400" fill="#7cdcc8">Saved Yes / No answers</text>
<text x="82" y="530" text-anchor="start" font-size="16" font-weight="600" fill="#edf4f6">TRACE</text>
<text x="44" y="568" text-anchor="start" font-size="16" font-weight="400" fill="#edf4f6">K consecutive Yes</text>
<text x="44" y="600" text-anchor="start" font-size="14" font-weight="400" fill="#afbec7">Query every q steps</text>
<text x="296" y="530" text-anchor="start" font-size="16" font-weight="600" fill="#edf4f6">delay-only</text>
<text x="258" y="567" text-anchor="start" font-size="15" font-weight="400" fill="#edf4f6">First Yes, then wait</text>
<text x="258" y="601" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">(K−1)q action steps</text>
<text x="24" y="708" text-anchor="start" font-size="14" font-weight="600" fill="#91baee">INDEPENDENT REFERENCES · NO MODEL INPUT</text>
<text x="82" y="765" text-anchor="start" font-size="17" font-weight="600" fill="#edf4f6">Visibility</text>
<text x="44" y="818" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">Target pixels</text>
<text x="44" y="846" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">Moon luminance</text>
<text x="44" y="875" text-anchor="start" font-size="14" font-weight="400" fill="#91baee">Evaluation only</text>
<text x="296" y="765" text-anchor="start" font-size="17" font-weight="600" fill="#edf4f6">Visibility</text>
<text x="258" y="818" text-anchor="start" font-size="16" font-weight="400" fill="#edf4f6">Truth → TRACE</text>
<text x="258" y="846" text-anchor="start" font-size="16" font-weight="400" fill="#edf4f6">replay</text>
<text x="258" y="875" text-anchor="start" font-size="14" font-weight="400" fill="#afbec7">Same frozen K/q</text>
<text x="82" y="984" text-anchor="start" font-size="16" font-weight="600" fill="#edf4f6">Script endpoint</text>
<text x="44" y="1022" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">Fixed route</text>
<text x="44" y="1053" text-anchor="start" font-size="16" font-weight="400" fill="#e1bd84">→ native STOP</text>
<text x="296" y="984" text-anchor="start" font-size="16" font-weight="600" fill="#edf4f6">Distance truth</text>
<text x="258" y="1021" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Mars / Moon &lt;20 m</text>
<text x="258" y="1052" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Cabin &lt;2 m</text>
<text x="89" y="1184" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">Stop metrics</text>
<text x="44" y="1236" text-anchor="start" font-size="22" font-weight="400" fill="#edf4f6">SR · SPL · OSR · NE · PL</text>
<text x="44" y="1265" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">240 test routes / model / world</text>
<text x="44" y="1299" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Visibility ≠ distance-based success</text>
<text x="24" y="1355" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">Routes, targets, cameras and splits stay fixed.</text>
<text x="24" y="1384" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">K/q frozen on dev. Native STOP has priority.</text>
<text x="82" y="786" text-anchor="start" font-size="17" font-weight="600" fill="#edf4f6">truth</text>
<text x="296" y="786" text-anchor="start" font-size="17" font-weight="600" fill="#edf4f6">Oracle</text>
</svg>