<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1430" width="460" height="1430" class="architecture-svg architecture-mobile" role="img" aria-labelledby="export-en.mobile-title export-en.mobile-desc" data-architecture-svg="mobile">
<title id="export-en.mobile-title">Evaluation data flow</title><desc id="export-en.mobile-desc">Current RGB and target phrase enter one Judger. Saved answers separately drive TRACE and delay-only. Visibility truth independently drives the Oracle. The script endpoint is a reference. Distance truth scores all outcomes. Motion illustrates dependencies, not model outputs or actual timings.</desc>
