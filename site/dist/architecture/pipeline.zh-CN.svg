<text x="34" y="48" text-anchor="start" font-size="14" font-weight="600" fill="#afbec7">01  观察输入</text>
<text x="330" y="48" text-anchor="start" font-size="14" font-weight="600" fill="#afbec7">02  视觉判断</text>
<text x="660" y="48" text-anchor="start" font-size="14" font-weight="600" fill="#afbec7">03  停止规则</text>
<text x="1010" y="48" text-anchor="start" font-size="14" font-weight="600" fill="#afbec7">04  结果评分</text>
<text x="99" y="128" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">观察输入</text>
<text x="56" y="198" text-anchor="start" font-size="18" font-weight="400" fill="#edf4f6">当前 RGB 图像</text>
<text x="56" y="224" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">1920 × 1080</text>
<text x="56" y="261" text-anchor="start" font-size="18" font-weight="400" fill="#7cdcc8">+ 目标短语</text>
<text x="56" y="308" text-anchor="start" font-size="14" font-weight="400" fill="#afbec7">同一路线 · 两种光照</text>
<text x="56" y="334" text-anchor="start" font-size="14" font-weight="400" fill="#afbec7">Isaac Sim 提供观察帧</text>
<text x="395" y="128" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">视觉 Judger</text>
<text x="352" y="182" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">每次评测使用一个模型</text>
<text x="352" y="222" text-anchor="start" font-size="18" font-weight="400" fill="#edf4f6">Qwen2.5-VL-3B</text>
<text x="352" y="257" text-anchor="start" font-size="18" font-weight="400" fill="#edf4f6">Lance_3B</text>
<text x="352" y="292" text-anchor="start" font-size="18" font-weight="400" fill="#edf4f6">Nova Lite 1.0</text>
<text x="352" y="332" text-anchor="start" font-size="15" font-weight="400" fill="#7cdcc8">保存 Yes / No 回答</text>
<text x="725" y="124" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">TRACE</text>
<text x="682" y="160" text-anchor="start" font-size="17" font-weight="400" fill="#edf4f6">连续 K 次 Yes</text>
<text x="682" y="186" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">每 q 个动作步查询</text>
<text x="725" y="272" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">delay-only</text>
<text x="682" y="304" text-anchor="start" font-size="16" font-weight="400" fill="#edf4f6">首次 Yes → 等待 (K−1)q 步</text>
<text x="682" y="330" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">不要求再次确认</text>
<text x="99" y="464" text-anchor="start" font-size="18" font-weight="600" fill="#edf4f6">可见性真值</text>
<text x="56" y="503" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">目标像素 · 月球亮度条件</text>
<text x="56" y="538" text-anchor="start" font-size="16" font-weight="400" fill="#91baee">仅用于评测</text>
<text x="725" y="464" text-anchor="start" font-size="18" font-weight="600" fill="#edf4f6">可见性 Oracle</text>
<text x="682" y="505" text-anchor="start" font-size="17" font-weight="400" fill="#edf4f6">真值 → TRACE 回放</text>
<text x="682" y="537" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">使用同一组冻结 K/q</text>
<text x="725" y="650" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">脚本终点</text>
<text x="682" y="684" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">固定路线 → 原生 STOP</text>
<text x="1075" y="128" text-anchor="start" font-size="20" font-weight="600" fill="#edf4f6">停止结果指标</text>
<text x="1032" y="203" text-anchor="start" font-size="23" font-weight="400" fill="#edf4f6">SR</text>
<text x="1032" y="228" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">是否停在成功区域</text>
<text x="1032" y="290" text-anchor="start" font-size="23" font-weight="400" fill="#edf4f6">SPL</text>
<text x="1032" y="315" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">成功与路径效率</text>
<text x="1032" y="374" text-anchor="start" font-size="20" font-weight="400" fill="#edf4f6">OSR · NE · PL</text>
<text x="1032" y="404" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">路线前缀、距离、路径长度</text>
<text x="1032" y="496" text-anchor="start" font-size="19" font-weight="400" fill="#edf4f6">240 条 test 路线</text>
<text x="1032" y="525" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">每个模型 / 世界</text>
<text x="1075" y="648" text-anchor="start" font-size="18" font-weight="600" fill="#edf4f6">距离真值</text>
<text x="1032" y="681" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">火星 / 月球 &lt;20 m</text>
<text x="1032" y="706" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">太空舱 &lt;2 m</text>
<text x="332" y="476" text-anchor="start" font-size="16" font-weight="600" fill="#91baee">独立参照分支</text>
<text x="332" y="523" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">不进入 Judger</text>
<text x="34" y="640" text-anchor="start" font-size="17" font-weight="600" fill="#edf4f6">两种光照保持一致</text>
<text x="34" y="673" text-anchor="start" font-size="16" font-weight="400" fill="#afbec7">路线 · 目标 · 相机 · dev/test 划分</text>
<text x="34" y="703" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">K/q 在基准光照 dev 上选择并冻结</text>
<text x="34" y="767" text-anchor="start" font-size="15" font-weight="400" fill="#afbec7">所有规则均保留原生 STOP 优先级。</text>
<text x="1246" y="767" text-anchor="end" font-size="15" font-weight="400" fill="#afbec7">可见性 ≠ 距离判定成功</text>
<text x="56" y="285" text-anchor="start" font-size="14" font-weight="400" fill="#afbec7">固定脚本轨迹</text>
</svg>