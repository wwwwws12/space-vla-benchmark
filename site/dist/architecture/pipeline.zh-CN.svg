<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" width="1280" height="790" class="architecture-svg architecture-desktop" role="img" aria-labelledby="export-zh-CN-title export-zh-CN-desc" data-architecture-svg="desktop">
<title id="export-zh-CN-title">评测数据流</title><desc id="export-zh-CN-desc">当前 RGB 和目标短语输入一个 Judger，保存的回答分别用于 TRACE 和 delay-only。可见性真值独立驱动 Oracle。脚本终点作为参照。所有停止结果使用距离真值评分。动画仅示意数据流向，不代表模型输出或实际耗时。</desc>
<defs>
<marker id="export-zh-CN-arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="#c0cdd2"></path></marker>
<filter id="export-zh-CN-glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
</defs>
<style>.architecture-svg text{font-family:Arial,"Microsoft YaHei",sans-serif}.architecture-svg .flow-motion{pointer-events:none}@media(prefers-reduced-motion:reduce){.architecture-svg .flow-motion{display:none}}</style>
